[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentlens"
version = "0.1.0"
description = "Qualitative assessment dashboard for coding agent trajectories."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Priyam Sahoo" },
    { name = "Gaurav Mittal" },
    { name = "Xiaomin Li" },
    { name = "Shengjie Ma" },
    { name = "Benjamin Steenhoek" },
    { name = "Pingping Lin" },
    { name = "Yu Hu" },
]

dependencies = [
    "swe-trace-sdk",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "python-multipart>=0.0.6",
    "anthropic>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "httpx>=0.24",
]

[project.urls]
Repository = "https://github.com/priyamsahoo/agentlens-app"
Paper = "https://arxiv.org/abs/2605.12925"

[tool.setuptools.packages.find]
include = ["backend*"]
